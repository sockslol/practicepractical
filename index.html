<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice Pratical</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="FormHolder">
      <div class="formHeader">
        <h1>Place an Order</h1>
      </div>
      <div>
        <form class="orderingForm">
          <label>Your Name</label>
          <input type="text" id="nameInput" class="nameInput" />

          <label>Food</label>
          <select id="foodInput" class="foodInput">
            <option value="4.50">Latte - $4.50</option>
            <option>Coffee - $1.50</option>
            <option>Ice- $99.99</option>
          </select>

          <label>Quanity:</label>
          <input type="number" id="amountInput" class="amountInput" />

          <button type="submit" class="submitButton" id="submitButton">
            Order Now
          </button>
        </form>
        <div>
          <p id="freak"></p>
        </div>
      </div>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
